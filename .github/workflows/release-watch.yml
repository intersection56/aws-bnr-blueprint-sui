name: release-watch

on:
  schedule:
    # Daily: Sui ships testnet every Tuesday and mainnet every second Wednesday
    # (docs.sui.io/operators/full-node/updates), and releases with a protocol
    # change must be applied before activation. A weekly run could lag a release
    # by up to 6 days. Opens one issue per new release; existing issues are reused.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare pinned sui-node releases with MystenLabs releases
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (tags can be repointed), same as ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check releases
        run: bash scripts/check-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
